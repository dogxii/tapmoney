<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TapTap 小游戏广告收益排行。">
  <title>TapMoney · 收益榜</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('tapmoney-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{document.documentElement.dataset.theme='light'}</script>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <!-- Lucide refresh-cw / Feather github; licenses in THIRD-PARTY-NOTICES.txt. -->
    <symbol id="i-refresh" viewBox="0 0 24 24" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-github" viewBox="0 0 24 24" stroke-width="2"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.3 13.2A8.5 8.5 0 0 1 10.8 3.7 8.5 8.5 0 1 0 20.3 13.2Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-3.5-5.5"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 5v14M7 14l5 5 5-5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1L20 7a3 3 0 0 0-4-4L4 15Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 4H4v16h5M9 12h12M17 8l4 4-4 4"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3l-9 9M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 16v5h16v-5"/></symbol>
  </defs></svg>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-start"><a class="brand" href="/" aria-label="TapMoney 首页"><span>TapMoney</span></a><nav aria-label="榜单"><select id="board-select" aria-label="切换榜单" hidden></select></nav></div>
      <div class="header-actions">
        <a class="icon-button" href="https://github.com/dogxii/tapmoney" target="_blank" rel="noopener noreferrer" aria-label="GitHub · TapMoney" title="GitHub"><svg class="icon" aria-hidden="true"><use href="#i-github"/></svg></a>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="切换深浅主题" title="切换深浅主题"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>

      </div>
    </header>
    <main>
      <div class="heading"><div class="heading-label"><h1>收益榜</h1><span class="as-of"><span id="freshness" class="status-dot"></span><span id="as-of">—</span></span></div>        <div class="toolbar heading-tools">
          <div class="tools">
            <div class="tabs view-tabs" aria-label="排行视图"><button type="button" data-view="games" class="active" aria-pressed="true">游戏</button><button type="button" data-view="authors" aria-pressed="false">作者</button></div>
            <label class="search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="search" type="search" placeholder="搜索" aria-label="搜索游戏或作者" autocomplete="off"></label>
            <button id="refresh" class="icon-button" type="button" aria-label="刷新快照" title="刷新快照"><svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg></button>
            <button id="export-ranking" class="icon-button" type="button" aria-label="导出榜单" title="导出榜单" disabled><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg></button>
          </div>
        </div></div>
      <div id="notice" class="notice" role="status" hidden></div>
      <p id="author-note" class="scope-note" hidden></p>
      <section class="ranking" aria-label="游戏收益排行" aria-busy="true">

        <div class="table-wrap" tabindex="0" role="region" aria-label="收益表格"><table><thead><tr><th scope="col" class="rank-column">#</th><th scope="col" class="game-column">游戏</th><th scope="col" class="author-column">作者</th><th scope="col" class="numeric selected" data-column="yesterday" aria-sort="descending"><button class="sort-button" type="button" data-metric="yesterday" title="按昨日收益从高到低排序" aria-label="按昨日收益从高到低排序">昨日<svg class="sort-arrow icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></th><th scope="col" class="numeric" data-column="month" aria-sort="none"><button class="sort-button" type="button" data-metric="month" title="按本月收益从高到低排序" aria-label="按本月收益从高到低排序">本月<svg class="sort-arrow icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></th><th scope="col" class="numeric" data-column="total" aria-sort="none"><button class="sort-button" type="button" data-metric="total" title="按累计收益从高到低排序" aria-label="按累计收益从高到低排序">累计<svg class="sort-arrow icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></th></tr></thead><tbody id="games"></tbody></table></div>
        <div id="empty" class="empty" hidden>没有匹配的游戏</div>
        <div id="loading" class="loading-state" role="status" aria-label="加载榜单"><span></span><span></span></div>
        <div class="ranking-footer"><div><span id="result-count">—</span><span id="aggregate-group"><span class="footer-separator"></span><span class="sum-mark" title="当前筛选结果合计" aria-hidden="true">Σ</span><strong id="aggregate" aria-label="收益合计">—</strong></span></div><nav id="pagination" class="pagination" aria-label="表格分页" hidden><button id="page-prev" class="icon-button" type="button" aria-label="上一页"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button><span id="page-position"></span><button id="page-next" class="icon-button" type="button" aria-label="下一页"><svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></nav><span class="updated"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg><time id="updated-at">—</time></span></div>
      </section>
    </main>
  </div>
  <button id="manage-open" class="manage-entry" type="button" title="管理" aria-label="管理" hidden><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
  <dialog id="game-detail" class="detail-dialog"></dialog>
  <dialog id="admin-dialog" class="admin-dialog"></dialog>
</body>
</html>
