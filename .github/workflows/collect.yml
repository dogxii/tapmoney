name: Update ranking

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ranking
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run collect
        env:
          TAPTAP_COOKIE: ${{ secrets.TAPTAP_COOKIE }}
          TAPTAP_DEVELOPER_ID: ${{ secrets.TAPTAP_DEVELOPER_ID }}
      - name: Commit public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/ site/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update ranking snapshot'
            git push origin HEAD:main
          fi
